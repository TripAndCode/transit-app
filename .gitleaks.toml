# transit-app gitleaks configuration.
#
# Extends the bundled default ruleset (do not replace — we want the full
# rule library). Allowlist below excludes paths that legitimately contain
# secret-shaped strings.

[extend]
useDefault = true

[allowlist]
description = "Project-specific allowlist"
paths = [
    # Placeholder values only (gsk_..., empty strings). gitleaks would
    # otherwise flag the variable names + placeholder shape.
    '''\.env\.example$''',
    # Test fixtures for BYOK / key-storage flows intentionally mention
    # secret-shaped strings in assertions and docstrings.
    '''tests/api/test_api_copilot\.py$''',
    '''tests/api/test_api_me_llm_key\.py$''',
    '''tests/db/test_user_llm_keys_db\.py$''',
    '''tests/unit/test_user_llm_keys\.py$''',
    # Negative-control fixture (tests/unit/test_gitleaks_fixtures.py): an
    # approved placeholder credential that would otherwise trip the same
    # rule as tests/fixtures/secrets/positive_control_credential.txt,
    # proving this allowlist mechanism itself suppresses a known-safe
    # example without disabling detection elsewhere.
    '''tests/fixtures/secrets/negative_control_allowed_placeholder\.txt$''',
]
