# transit-app gitleaks configuration.
#
# Extends the bundled default ruleset (do not replace — we want the full
# rule library). Allowlist below excludes paths that legitimately contain
# secret-shaped strings.

[extend]
useDefault = true

[allowlist]
description = "Project-specific allowlist"
paths = [
    # Placeholder values only (gsk_..., empty strings). gitleaks would
    # otherwise flag the variable names + placeholder shape.
    '''\.env\.example$''',
    # Test fixtures for BYOK / key-storage flows intentionally mention
    # secret-shaped strings in assertions and docstrings.
    '''tests/api/test_api_copilot\.py$''',
    '''tests/api/test_api_me_llm_key\.py$''',
    '''tests/db/test_user_llm_keys_db\.py$''',
    '''tests/unit/test_user_llm_keys\.py$''',
    # Positive/negative control fixtures for the gitleaks hook itself
    # (tests/unit/test_gitleaks_fixtures.py). Both intentionally contain a
    # real-shaped example credential (AWS's own published, non-functional
    # placeholder) and must stay allowlisted here so the routine full-repo
    # scan (`make verify-secrets`, CI's secrets-scan.yml) doesn't
    # perpetually flag a fixture that's supposed to be there forever. The
    # fixtures test instead re-scans each one directly with an
    # allowlist-free config, proving gitleaks' ruleset really does catch
    # and redact this credential shape independent of this allowlist.
    '''tests/fixtures/secrets/positive_control_credential\.txt$''',
    '''tests/fixtures/secrets/negative_control_allowed_placeholder\.txt$''',
]
