<!doctype html>
<html lang="ja">
  <head>
    <script>
      // Paints data-theme before first render so the page never flashes the
      // wrong theme. Mirrors readThemePref/resolveTheme in src/styles/theme.ts;
      // src/styles/theme.test.ts asserts the two stay in step.
      (function () {
        try {
          var stored = localStorage.getItem("transit.theme");
          var pref =
            stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            pref === "system" ? (prefersDark ? "dark" : "light") : pref;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <script>
      // Starts downloading the active language's strings alongside the entry
      // chunk instead of after it runs. Mirrors the language resolution in
      // src/i18n/index.ts (stored choice, then navigator, else ja); the
      // "index.html locale preload" tests in src/i18n/localeLoading.test.tsx
      // keep the two in agreement. The build replaces the placeholder with
      // each language's chunk URL.
      (function (chunks) {
        function has(code) {
          return Object.prototype.hasOwnProperty.call(chunks, code);
        }
        var codes = [];
        try {
          var stored = localStorage.getItem("app.locale");
          if (stored) codes.push(stored);
        } catch (e) {}
        var nav = navigator.languages || [];
        for (var i = 0; i < nav.length; i++) codes.push(nav[i]);
        if (navigator.language) codes.push(navigator.language);
        var lng;
        for (i = 0; i < codes.length && !lng; i++) if (has(codes[i])) lng = codes[i];
        for (i = 0; i < codes.length && !lng; i++) if (has(codes[i].split("-")[0])) lng = codes[i].split("-")[0];
        lng = lng || "ja";
        if (!has(lng)) return;
        var link = document.createElement("link");
        link.rel = "modulepreload";
        link.crossOrigin = "";
        link.href = chunks[lng];
        document.head.appendChild(link);
      })(/*__LOCALE_CHUNKS__*/ {});
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Weights match what the app actually sets (grep font-weight/fontWeight):
         Noto Sans JP 400/500/600/700/800 for body text, Noto Serif JP 400/600
         for --font-display's identity-moments-only headings. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;600&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>遅延ダッシュボード</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
