<!doctype html>
<html lang="ja">
  <head>
    <script>
      // Paints data-theme before first render so the page never flashes the
      // wrong theme. Mirrors readThemePref/resolveTheme in src/styles/theme.ts;
      // src/styles/theme.test.ts asserts the two stay in step.
      (function () {
        try {
          var stored = localStorage.getItem("transit.theme");
          var pref =
            stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            pref === "system" ? (prefersDark ? "dark" : "light") : pref;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Weights match what the app actually sets (grep font-weight/fontWeight):
         Noto Sans JP 400/500/600/700/800 for body text, Noto Serif JP 400/600
         for --font-display's identity-moments-only headings. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;600&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>遅延ダッシュボード</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
