[tool.poetry]
name = "transit-delay-app"
version = "0.1.0"
description = "Transit delay analysis platform for Japanese GTFS-JP agencies"
authors = []
packages = [
    {include = "pipeline"},
    {include = "api"},
    {include = "tests"},
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
psycopg2-binary = ">=2.9"
pandas = ">=2.2"
groq = ">=0.11"
slowapi = ">=0.1"
sentence-transformers = ">=2.7"
asyncpg = ">=0.29"
fastapi = ">=0.111"
uvicorn = {version = ">=0.29", extras = ["standard"]}

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"
httpx = ">=0.27"
ruff = ">=0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
