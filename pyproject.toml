[tool.poetry]
name = "transit-delay-app"
version = "0.1.0"
description = "Transit delay analysis platform for Japanese GTFS-JP agencies"
authors = []
packages = [
    {include = "pipeline"},
    {include = "api"},
    {include = "tests"},
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
psycopg2-binary = ">=2.9"
pandas = ">=2.2"
groq = ">=0.11"
openai = ">=1.50"
slowapi = ">=0.1"
sentence-transformers = "^3.0"
asyncpg = ">=0.29"
fastapi = ">=0.111"
uvicorn = {version = ">=0.29", extras = ["standard"]}
authlib = ">=1.3"
itsdangerous = ">=2.2"
clickhouse-connect = {markers = "python_version < \"3.15\"", version = "^1.6.0", extras = ["async"]}

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5"
httpx = ">=0.27"
ruff = ">=0.4"
mypy = ">=1.14"
playwright = "^1.60.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_groq_key: tests that need a live GROQ_API_KEY and the dev API reachable (off by default)",
    "slow: Test downloads/loads ~120MB ML models; gated by RUN_SLOW=1",
]

[tool.mypy]
files = ["api", "pipeline", "db"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "T20", "RUF"]
# RUF001-003: full-width Japanese punctuation in strings/comments is intentional
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection calls are safe in argument defaults
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# CLI scripts and tests may print to stdout; test stubs use mutable class attrs
"scripts/*" = ["T20"]
"frontend/scripts/*" = ["T20"]
"tests/*" = ["T20", "RUF012"]
