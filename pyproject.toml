[tool.poetry]
name = "transit-delay-app"
version = "0.1.0"
description = "Transit delay analysis platform for Japanese GTFS-JP agencies"
authors = []
# CI and the Dockerfile pin an exact version inside this range
# (tests/unit/test_poetry_pins.py keeps them in step).
requires-poetry = ">=2.5,<3"
packages = [
    {include = "pipeline"},
    {include = "api"},
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
psycopg2-binary = ">=2.9"
openai = ">=1.50"
slowapi = ">=0.1"
asyncpg = ">=0.29"
fastapi = ">=0.111"
uvicorn = {version = ">=0.29", extras = ["standard"]}
authlib = ">=1.3"
itsdangerous = ">=2.2"
cryptography = ">=48,<51"
clickhouse-connect = {version = "^1.6.0", extras = ["async"]}
boto3 = "^1.35"
pyarrow = ">=22,<27"
# Japanese public holidays: the day-type rule for dates a feed's own calendar does not cover.
jpholiday = "^1.0.3"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5"
httpx = ">=0.27"
ruff = ">=0.4"
mypy = ">=1.14"
playwright = "^1.60.0"
packaging = ">=24"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
# The delay-forecast models. The VPS workbench and CI's test job install this
# group; the deploy image installs `--only main`, and the `image` job's
# `import api.main` (which loads every router) catches an accidental import
# of it creeping into the app.
numpy = ">=2.2"
pandas = "^3"
lightgbm = "^4.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "anyio: async test driven by anyio's pytest plugin instead of pytest-asyncio's auto mode",
]

[tool.mypy]
files = ["api", "pipeline", "db", "scripts", "ml", "gtfs_pipeline.py"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "api.routers.*"
disallow_incomplete_defs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "T20", "RUF"]
# RUF001-003: full-width Japanese punctuation in strings/comments is intentional
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection calls are safe in argument defaults
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# CLI scripts and tests may print to stdout; test stubs use mutable class attrs
"scripts/*" = ["T20"]
"frontend/scripts/*" = ["T20"]
"tests/*" = ["T20", "RUF012"]
