services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    platform: linux/amd64
    container_name: transit-pg
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
      POSTGRES_DB: transit
    ports:
      - "5433:5432"
    volumes:
      - transit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transit_pgdata:
