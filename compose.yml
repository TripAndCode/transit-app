services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    platform: linux/amd64
    container_name: transit-pg
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit}
      POSTGRES_DB: transit
    ports:
      - "5433:5432"
    volumes:
      - transit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      timeout: 5s
      retries: 10

# This compose file is for LOCAL DEVELOPMENT only — it brings up the
# PostGIS+pgvector database (`make db`) that `make serve` connects to.
# Production runs on Railway (app + a separate DB service built from the
# same `db/Dockerfile`), push-to-deploy — see docs/deploy-railway.md.

volumes:
  transit_pgdata:
