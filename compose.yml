# No top-level `name:` on purpose. Compose then derives the project name from
# each checkout's directory, so two worktrees get distinct container, network
# and volume names. A literal name here would pin every checkout to one project
# and make the second `docker compose up` silently attach to the first's
# containers and its data volume -- the same collision `container_name` caused,
# one level up.
services:
  db:
    build:
      # Context is `db/`, matching every other caller (`docker build … db/`), so
      # the Dockerfile's COPY resolves the same way everywhere and the context
      # stays this directory rather than the whole repository.
      context: db
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit}
      POSTGRES_DB: transit
    ports:
      # Loopback-bound for the same reason as ClickHouse's port below.
      - "127.0.0.1:5433:5432"
    volumes:
      - transit_pgdata:/var/lib/postgresql/data
    healthcheck:
      # `-h localhost` forces the check onto TCP. The official image's first run
      # starts a temporary socket-only server to bootstrap the data directory, so
      # an unqualified `pg_isready` reports healthy before the real,
      # TCP-listening server has replaced it — and whatever connects next is
      # refused.
      test: ["CMD-SHELL", "pg_isready -h localhost -U transit -d transit"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_USER: transit
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-transit}
      CLICKHOUSE_DB: transit
    ports:
      # Loopback-bound: `docker -p` bypasses host firewalls on Linux, and
      # nothing in this codebase speaks ClickHouse's native protocol (both
      # clients are clickhouse-connect over HTTP) -- 9000 was published with
      # nothing using it. Drop to 127.0.0.1:9000:9000 locally if you need
      # `clickhouse-client` directly.
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - transit_chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

# This compose file is for LOCAL DEVELOPMENT only — it brings up the
# PostGIS+pgvector database (`make db`) and ClickHouse that `make serve` connects to.
# Production runs on Railway (app + separate DB services built from the
# same `db/Dockerfile`), push-to-deploy — see docs/deploy-railway.md.

volumes:
  transit_pgdata:
  transit_chdata:
