# Every update PR costs a full CI run and a review pass before it can merge,
# so this file is tuned for a batch one maintainer gets through rather than
# for update latency.
#
# - `rebase-strategy: disabled`: Dependabot otherwise rebases every open PR
#   each time `main` moves, turning a weekly batch into a continuous stream of
#   runs. Rebase one by hand when it is time to merge it.
# - `open-pull-requests-limit`: the default is five per ecosystem, so fifteen
#   update PRs can be open at once, more than one review sitting gets through.
#   Three keeps a batch bounded; Dependabot opens the next one as these are
#   merged.
# - A Saturday night schedule puts the batch where it competes with nothing.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # vitest and its `@vitest/*` plugins pin each other's exact version, so
      # a major bumped on one side alone fails every test file at coverage
      # collection. Minor and patch bumps already land together above; this
      # keeps a major in one PR too.
      vitest-major:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
    ignore:
      # `typescript-6` (package.json) is a deliberate `npm:typescript@6.0.3`
      # alias pinned for dual-version testing/compat, not a dependency meant
      # to track latest -- an update PR here would just bump the pin away
      # from the version it exists to test against.
      - dependency-name: "typescript-6"

  # Covers Poetry: the pip ecosystem reads pyproject.toml/poetry.lock, and
  # this repo has no requirements.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Base-image bumps for the app image + `compose.yml` (the node and python
  # bases, clickhouse/clickhouse-server).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # db/Dockerfile (the postgres base) -- kept separate from "/" above so a
  # bump here doesn't get grouped with the app image/compose bumps, which
  # have an unrelated release cadence.
  - package-ecosystem: "docker"
    directory: "/db"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # A Postgres major changes the on-disk format, so a server on the new
      # base cannot start on an existing data volume. The dev volume holds
      # real data and needs a dump/restore or pg_upgrade first, which makes a
      # major a planned migration rather than an update PR.
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"

  # tools/geosql/compose.yml (dekartxyz/dekart) -- a standalone local tool,
  # not part of the deployed app.
  - package-ecosystem: "docker"
    directory: "/tools/geosql"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
