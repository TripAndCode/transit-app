# Every update PR costs a full CI run on the one self-hosted runner that also
# gates the branch someone is trying to merge, so this file is tuned for
# throughput on that runner rather than for update latency.
#
# - `rebase-strategy: disabled`: Dependabot otherwise rebases every open PR
#   each time `main` moves, turning a weekly batch into a continuous stream of
#   runs. Rebase one by hand when it is time to merge it.
# - `open-pull-requests-limit`: the default is five per ecosystem, so fifteen
#   update PRs can be open at once -- at roughly ten minutes of runner time
#   each, that is a queue no interactive merge gets through. Three keeps a
#   batch bounded; Dependabot opens the next one as these are merged.
# - A Saturday night schedule puts the batch where it competes with nothing.
#   Landing it mid-week blocks the merge queue for the rest of the day, which
#   is exactly what the first run of this config did.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # `typescript-6` (package.json) is a deliberate `npm:typescript@6.0.3`
      # alias pinned for dual-version testing/compat, not a dependency meant
      # to track latest -- an update PR here would just bump the pin away
      # from the version it exists to test against.
      - dependency-name: "typescript-6"

  # Covers Poetry: the pip ecosystem reads pyproject.toml/poetry.lock, and
  # this repo has no requirements.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Base-image bumps for the app image + `compose.yml` (node:22-alpine,
  # python:3.12-slim, clickhouse/clickhouse-server).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # db/Dockerfile (postgres:14 base) -- kept separate from "/" above so a
  # bump here doesn't get grouped with the app image/compose bumps, which
  # have an unrelated release cadence.
  - package-ecosystem: "docker"
    directory: "/db"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # tools/geosql/compose.yml (dekartxyz/dekart) -- a standalone local tool,
  # not part of the deployed app.
  - package-ecosystem: "docker"
    directory: "/tools/geosql"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    rebase-strategy: "disabled"
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
