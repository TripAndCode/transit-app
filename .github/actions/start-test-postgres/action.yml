name: Start test Postgres
description: >-
  Build the repository's own db/Dockerfile and run it as the Postgres a job
  connects to, waiting until it actually accepts TCP connections.

inputs:
  container-name:
    description: Name for the container, so parallel jobs do not collide.
    required: true
  port:
    description: Host port to publish Postgres on.
    required: false
    default: "5433"
  database:
    description: Database to create and probe.
    required: false
    default: transit

runs:
  using: composite
  steps:
    # Built from db/Dockerfile rather than declared as a `services:` entry:
    # that block can only pull a published image, and none carries PostGIS and
    # pgvector together. Building it keeps every workflow, local dev, and the
    # throwaway test database on one definition, so a schema that migrates
    # locally cannot fail in CI on a missing extension.
    - shell: bash
      run: |
        docker build -t "${{ inputs.container-name }}" db/
        docker run -d --name "${{ inputs.container-name }}" \
          -e POSTGRES_USER=transit -e POSTGRES_PASSWORD=transit \
          -e POSTGRES_DB="${{ inputs.database }}" \
          -p "${{ inputs.port }}:5432" "${{ inputs.container-name }}"
        # `-h localhost` forces the check onto TCP. The official image's first
        # run answers on the Unix socket from a temporary bootstrap server
        # before the real, TCP-listening server replaces it, so an unqualified
        # probe reports ready while the next step would still be refused.
        for _ in $(seq 1 60); do
          if docker exec "${{ inputs.container-name }}" \
              pg_isready -h localhost -U transit -d "${{ inputs.database }}" >/dev/null 2>&1; then
            echo "postgres ready"
            exit 0
          fi
          sleep 2
        done
        echo "postgres did not become ready" >&2
        docker logs "${{ inputs.container-name }}" >&2
        exit 1
