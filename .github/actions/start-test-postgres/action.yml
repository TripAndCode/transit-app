name: Start test Postgres
description: >-
  Build the repository's own db/Dockerfile and run it as the Postgres a job
  connects to, waiting until it actually accepts TCP connections.

inputs:
  container-name:
    description: Name for the container, so parallel jobs do not collide.
    required: true

outputs:
  port:
    description: Host port the container's Postgres is published on.
    value: ${{ steps.publish.outputs.port }}

runs:
  using: composite
  steps:
    # A GitHub-hosted VM is destroyed after the job, so a same-named
    # container from a prior run never exists. A persistent self-hosted
    # runner keeps its filesystem/Docker state between runs, so a container
    # left behind by a cancelled or crashed job would otherwise collide
    # with this one on both name and port.
    - name: Remove any leftover container from a previous run
      shell: bash
      run: docker rm -f "${{ inputs.container-name }}" 2>/dev/null || true

    # Built from db/Dockerfile rather than declared as a `services:` entry:
    # that block can only pull a published image, and none carries PostGIS and
    # pgvector together. Building it keeps every workflow, local dev, and the
    # throwaway test database on one definition, so a schema that migrates
    # locally cannot fail here on a missing extension.
    - name: Build the database image
      shell: bash
      run: |
        set -euo pipefail
        docker build -t "${{ inputs.container-name }}" db/

    # The database name/user are fixed (callers name them again in their own
    # DATABASE_URL, so a second knob would let the two drift with nothing to
    # catch it), but the host port is left to Docker to assign, exactly like
    # the ClickHouse service container this repo's CI also runs: a
    # persistent runner can already have something bound to a fixed port
    # (including 5433, the documented dev-DB port this container must not
    # collide with), which an ephemeral GitHub-hosted VM never hits.
    - name: Run the container
      shell: bash
      run: |
        set -euo pipefail
        docker run -d --name "${{ inputs.container-name }}" \
          -e POSTGRES_USER=transit -e POSTGRES_PASSWORD=transit \
          -e POSTGRES_DB=transit \
          -p 127.0.0.1::5432 "${{ inputs.container-name }}"

    - name: Publish the assigned port
      id: publish
      shell: bash
      run: |
        set -euo pipefail
        port="$(docker port "${{ inputs.container-name }}" 5432/tcp | head -n1 | cut -d: -f2)"
        echo "port=$port" >> "$GITHUB_OUTPUT"

    # `-h localhost` forces the check onto TCP. The official image's first run
    # answers on the Unix socket from a temporary bootstrap server before the
    # real, TCP-listening server replaces it, so an unqualified probe reports
    # ready while the next step would still be refused.
    - name: Wait for TCP readiness
      shell: bash
      run: |
        set -euo pipefail
        for _ in $(seq 1 60); do
          if docker exec "${{ inputs.container-name }}" \
              pg_isready -h localhost -U transit -d transit >/dev/null 2>&1; then
            echo "postgres ready"
            exit 0
          fi
          sleep 2
        done
        echo "postgres did not become ready" >&2
        docker logs "${{ inputs.container-name }}" >&2
        exit 1
