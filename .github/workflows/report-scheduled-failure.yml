name: report-scheduled-failure

# The last job of every scheduled workflow calls this when one of its other
# jobs failed on a scheduled run (tests/unit/test_ci_workflow_gates.py keeps
# each of them doing so). GitHub tells only the account that last edited a
# cron line about a failed scheduled run, so the failure goes to an issue
# instead: one tracking issue per workflow, found by its label and title, that
# each later failing run comments on while it stays open. A called workflow
# sees its caller's `github` context, so the workflow and run named here are
# the caller's.
on:
  workflow_call: {}

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open the tracking issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label=scheduled-failure
          title="Scheduled run failing: $WORKFLOW"
          run="[$WORKFLOW run #$RUN_NUMBER]($RUN_URL)"
          gh label create "$label" --color c5def5 --description "A scheduled workflow run failed" --force
          number=$(gh issue list --label "$label" --state open --limit 100 --json number,title |
            jq -r --arg title "$title" 'map(select(.title == $title)) | first | .number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$run failed as well."
          else
            gh issue create --title "$title" --label "$label" --body "$run failed. Every later scheduled run of this workflow that fails comments here while this issue is open; close it once the workflow passes again."
          fi
