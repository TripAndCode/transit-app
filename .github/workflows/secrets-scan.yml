name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: read-only is enough — we don't post PR comments or
# upload SARIF; the job just exits non-zero on a finding.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 0 = full history; lets the scan catch a secret that was
          # introduced in an earlier commit and only rebased into the PR.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pinned to the same version as .pre-commit-config.yaml so
          # local hook output matches CI output.
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan
        # Same invocation as `make verify-secrets`. --source . scans the
        # full git history reachable from HEAD; the repo's .gitleaks.toml
        # is auto-discovered and its allowlist for .env.example applies.
        run: gitleaks detect --redact --no-banner --source .
