name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: read-only is enough — we don't post PR comments or
# upload SARIF; the job just exits non-zero on a finding.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 0 = full history; lets the scan catch a secret that was
          # introduced in an earlier commit and only rebased into the PR.
          fetch-depth: 0
          # Check out the PR head SHA directly instead of GitHub's
          # synthetic refs/pull/<N>/merge ref. The merge ref can be
          # stale or unfetchable when the PR has been force-pushed,
          # producing "could not read Username for github.com" errors
          # during the secondary fetch step. Trade-off: we scan the PR
          # head, not the hypothetical merge result, so secrets newly
          # added to main between PR-open and merge are caught only on
          # the next rebase. Falls back to github.sha for push events.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install gitleaks
        env:
          # Pinned to the same version as .pre-commit-config.yaml so
          # local hook output matches CI output.
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          # Fetched to a file with retries: GitHub's release downloads fail
          # transiently (5xx), and a retried transfer piped to tar could hand
          # it a partial stream. When they stay down, the same version is
          # built from the Go module proxy, whose checksum database verifies
          # the source.
          if curl -sSfL --connect-timeout 20 --max-time 120 --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"; then
            sudo tar -xz -C /usr/local/bin -f "$RUNNER_TEMP/gitleaks.tar.gz" gitleaks
          else
            GOBIN="$RUNNER_TEMP/bin" go install \
              -ldflags "-X=github.com/zricethezav/gitleaks/v8/cmd.Version=${GITLEAKS_VERSION}" \
              "github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}"
            sudo install -m 0755 "$RUNNER_TEMP/bin/gitleaks" /usr/local/bin/gitleaks
          fi
          gitleaks version

      - name: Scan
        # Same invocation as `make verify-secrets`. --source . scans the
        # full git history reachable from HEAD; the repo's .gitleaks.toml
        # is auto-discovered and its allowlist for .env.example applies.
        run: gitleaks detect --redact --no-banner --source .
