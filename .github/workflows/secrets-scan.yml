name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 0 = full history; lets the scan catch a secret that was
          # introduced in an earlier commit and only rebased into the PR.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Empty value keeps us on the OSS license path (no key required).
          GITLEAKS_LICENSE: ""
