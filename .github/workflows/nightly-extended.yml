name: Nightly extended

# Runs suites `ci.yml` deliberately skips on every push/PR because they're
# either slow (RUN_SLOW's ~120MB model download), need a real browser
# (RUN_I18N_SCAN, RUN_DASHBOARD_E2E_SCAN), or the 15 Oracle-collector bash
# suites under oracle_cloud/v3/tests/, which nothing else runs at all.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The Postgres container name is fixed, and start-test-postgres removes any
# leftover container with that name before starting its own -- so a manual
# dispatch overlapping a running schedule would tear down the first run's
# database mid-test. Queue instead of cancelling: a nightly run that is
# already partway through is worth finishing.
concurrency:
  group: nightly-extended
  cancel-in-progress: false

jobs:
  oracle-bash-tests:
    runs-on: [self-hosted, vps]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run Oracle-collector bash suites
        run: make oracle-tests

  python-extended:
    runs-on: [self-hosted, vps]
    timeout-minutes: 60

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DB: transit_test
        ports:
          - 8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/share/swift 2>/dev/null || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install

      # RUN_I18N_SCAN and RUN_DASHBOARD_E2E_SCAN drive a real Chromium
      # against the built SPA (see those tests' own module docstrings) —
      # without both of these, they self-skip for a setup reason rather
      # than actually running, which the fail-if-still-skipped check below
      # cannot tell apart from the suite being newly broken.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright's Chromium
        run: poetry run playwright install chromium

      - name: Start Postgres from db/Dockerfile
        id: postgres
        uses: ./.github/actions/start-test-postgres
        with:
          container-name: transit-nightly-db

      - name: Apply schema
        run: poetry run python gtfs_pipeline.py migrate up
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:${{ steps.postgres.outputs.port }}/transit

      - name: Apply ClickHouse schema
        run: |
          poetry run python -c "from pipeline.clickhouse import get_client; \
          from db.clickhouse.bootstrap import apply_schema; apply_schema(get_client())"
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test

      # -ra: a one-line reason for every non-passing test, including
      # skips — the input the fail-if-still-skipped step below greps.
      - name: Run extended pytest suites
        run: poetry run pytest -ra | tee pytest-extended.log
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:${{ steps.postgres.outputs.port }}/transit
          GEMINI_API_KEY: test-key
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_TEST_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test
          RUN_CH_INTEGRATION: 1
          RUN_SLOW: 1
          RUN_I18N_SCAN: 1
          RUN_DASHBOARD_E2E_SCAN: 1

      # The whole point of this job is that these three files' tests run
      # for real on this schedule, not that `pytest` merely exits 0 — a
      # missing dependency or a build step that silently stopped working
      # would leave them self-skipped (still exit 0) forever. Fail loud
      # instead so that regresses back into a visible nightly failure.
      - name: Fail if the gated tests are still skipped
        run: |
          if grep -E "^SKIPPED .*(test_embeddings|i18n_coverage_test|dashboard_synthetic_display_test)" pytest-extended.log; then
            echo "::error::a RUN_SLOW/RUN_I18N_SCAN/RUN_DASHBOARD_E2E_SCAN test was skipped instead of run" >&2
            exit 1
          fi
