name: Nightly extended

# Runs suites `ci.yml` deliberately skips on every push/PR because they're
# either slow (RUN_SLOW's ~120MB model download), need a real browser
# (RUN_I18N_SCAN, RUN_DASHBOARD_E2E_SCAN), or the 15 Oracle-collector bash
# suites under oracle_cloud/v3/tests/, which nothing else runs at all.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Queue overlapping runs instead of cancelling: a nightly run already partway
# through is worth finishing, and this job is long enough that a manual
# dispatch can easily land on top of a scheduled one.
concurrency:
  group: nightly-extended
  cancel-in-progress: false

jobs:
  oracle-bash-tests:
    runs-on: [self-hosted, vps]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Run Oracle-collector bash suites
        run: make oracle-tests

  python-extended:
    runs-on: [self-hosted, vps]
    timeout-minutes: 60

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        env:
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DB: transit_test
        ports:
          - 8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      # `--with embeddings`: that group is optional (pyproject.toml keeps torch
      # et al out of the deploy image), and this job is the one that sets
      # RUN_SLOW=1 and treats a skipped test_embeddings as a failure. Without
      # it the embedder import raises ModuleNotFoundError, Embedder degrades to
      # unavailable, and that test fails rather than skips — so the guard below
      # cannot save a run that never had the dependency it demands. A
      # persistent self-hosted runner can mask this by retaining the group from
      # an earlier install; a rebuilt venv would not.
      - name: Install dependencies
        run: poetry install --with embeddings

      # RUN_I18N_SCAN and RUN_DASHBOARD_E2E_SCAN drive a real Chromium
      # against the built SPA (see those tests' own module docstrings) —
      # without both of these, they self-skip for a setup reason rather
      # than actually running, which the fail-if-still-skipped check below
      # cannot tell apart from the suite being newly broken.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # `npm run build` writes frontend/dist; both gated tests open
      # api/static/index.html. `make bake` is the one definition of that
      # copy (it also strips the vite manifest), so this calls it rather
      # than repeating a cp here and letting the two drift. Without this
      # step the tests self-skip on a missing SPA and the guard below
      # reports it as the suite being broken.
      - name: Bake the SPA into api/static
        run: make bake

      - name: Install Playwright's Chromium
        run: poetry run playwright install chromium

      - name: Start Postgres from db/Dockerfile
        id: postgres
        uses: ./.github/actions/start-test-postgres
        with:
          container-name: transit-nightly-db

      - name: Apply schema
        run: poetry run python gtfs_pipeline.py migrate up
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:${{ steps.postgres.outputs.port }}/transit

      - name: Apply ClickHouse schema
        run: |
          poetry run python -c "from pipeline.clickhouse import get_client; \
          from db.clickhouse.bootstrap import apply_schema; apply_schema(get_client())"
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test

      # -ra: a one-line reason for every non-passing test, including
      # skips — the input the fail-if-still-skipped step below greps.
      - name: Run extended pytest suites
        run: poetry run pytest -ra | tee pytest-extended.log
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:${{ steps.postgres.outputs.port }}/transit
          GEMINI_API_KEY: test-key
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_TEST_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test
          RUN_CH_INTEGRATION: 1
          RUN_SLOW: 1
          RUN_I18N_SCAN: 1
          RUN_DASHBOARD_E2E_SCAN: 1

      # The whole point of this job is that these three files' tests run
      # for real on this schedule, not that `pytest` merely exits 0 — a
      # missing dependency or a build step that silently stopped working
      # would leave them self-skipped (still exit 0) forever. Fail loud
      # instead so that regresses back into a visible nightly failure.
      - name: Fail if the gated tests are still skipped
        run: |
          if grep -E "^SKIPPED .*(test_embeddings|i18n_coverage_test|dashboard_synthetic_display_test)" pytest-extended.log; then
            echo "::error::a RUN_SLOW/RUN_I18N_SCAN/RUN_DASHBOARD_E2E_SCAN test was skipped instead of run" >&2
            exit 1
          fi

      # The action's label reaper would eventually collect this, but only
      # after three hours. Removing it here returns the disk and the volume
      # as soon as the job ends.
      - name: Stop and remove the Postgres container
        if: always()
        run: docker rm -f -v "${{ steps.postgres.outputs.container-name }}" 2>/dev/null || true

  # The push/PR-gated `ci.yml` deliberately skips the optional `embeddings`
  # group (pyproject.toml: several GB of torch/transformers, unused until a RAG
  # index exists, and `pipeline.query.embeddings.Embedder` tolerates it being
  # absent by falling through to the LLM-only path). The python-extended job
  # above installs it for the RUN_SLOW `test_embeddings` gate, but on a
  # persistent runner whose venv may already hold the group from an earlier
  # install. This job is the clean-runner check: a fresh `--with embeddings`
  # install, then import and embed, with no database or API server. A silent
  # break here would otherwise surface only as Stage 2 of the Ask router
  # quietly falling through to the LLM every time, in production. Scheduled
  # here rather than on every push because the install and model download are
  # minutes of extra runner time not worth paying on every change.
  embeddings-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies (including the optional embeddings group)
        run: poetry install --with embeddings

      - name: Import pipeline.query.embeddings and embed one string
        run: |
          poetry run python -c "
          from pipeline.query.embeddings import Embedder

          e = Embedder()
          assert e.available, 'Embedder unavailable after installing the embeddings group'
          vec = e.embed('what routes are in the data?', mode='query')
          assert len(vec) == e.dim, f'expected a {e.dim}-dim vector, got {len(vec)}'
          "
