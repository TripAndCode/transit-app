name: Nightly extended

# Runs suites `ci.yml` deliberately skips on every push/PR because they
# need a real browser (RUN_I18N_SCAN, RUN_DASHBOARD_E2E_SCAN). It also re-runs the Oracle-collector
# bash suites under oracle_cloud/v3/tests/, which `ci.yml` already runs on
# every pull request and every push to `main` -- kept here too to catch drift
# in the runner's own bash/coreutils between pushes, not to recheck code that
# has not changed.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Queue overlapping runs instead of cancelling: a nightly run already partway
# through is worth finishing, and this job is long enough that a manual
# dispatch can easily land on top of a scheduled one.
concurrency:
  group: nightly-extended
  cancel-in-progress: false

jobs:
  oracle-bash-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Run Oracle-collector bash suites
        run: make oracle-tests

  python-extended:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        env:
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DB: transit_test
        ports:
          - 8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install Poetry
        run: pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install

      # RUN_I18N_SCAN and RUN_DASHBOARD_E2E_SCAN drive a real Chromium
      # against the built SPA (see those tests' own module docstrings) —
      # without both of these, they self-skip for a setup reason rather
      # than actually running, which the fail-if-still-skipped check below
      # cannot tell apart from the suite being newly broken.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # `npm run build` writes frontend/dist; both gated tests open
      # api/static/index.html. `make bake` is the one definition of that
      # copy (it also strips the vite manifest), so this calls it rather
      # than repeating a cp here and letting the two drift. Without this
      # step the tests self-skip on a missing SPA and the guard below
      # reports it as the suite being broken.
      - name: Bake the SPA into api/static
        run: make bake

      # `--with-deps` also installs the system libraries Chromium links
      # against, which a fresh hosted machine does not carry.
      - name: Install Playwright's Chromium
        run: poetry run playwright install --with-deps chromium

      - name: Start Postgres from db/Dockerfile
        id: postgres
        uses: ./.github/actions/start-test-postgres
        with:
          container-name: transit-nightly-db

      # No schema step: tests/conftest.py redirects DATABASE_URL to the
      # `<db>_test` sibling, creates it and migrates it in a session fixture.

      - name: Apply ClickHouse schema
        run: |
          poetry run python -c "from pipeline.clickhouse import get_client; \
          from db.clickhouse.bootstrap import apply_schema; apply_schema(get_client())"
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test

      # -ra: a one-line reason for every non-passing test, including
      # skips — the input the fail-if-still-skipped step below greps.
      # `shell: bash` selects `-o pipefail`, so pytest's exit status survives
      # the pipe into tee instead of being replaced by tee's.
      - name: Run extended pytest suites
        shell: bash
        run: poetry run pytest -ra | tee pytest-extended.log
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:${{ steps.postgres.outputs.port }}/transit
          GEMINI_API_KEY: test-key
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_TEST_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test
          RUN_CH_INTEGRATION: 1
          RUN_I18N_SCAN: 1
          RUN_DASHBOARD_E2E_SCAN: 1

      # The whole point of this job is that these files' tests run
      # for real on this schedule, not that `pytest` merely exits 0 — a
      # missing dependency or a build step that silently stopped working
      # would leave them self-skipped (still exit 0) forever. Fail loud
      # instead so that regresses back into a visible nightly failure.
      - name: Fail if the gated tests are still skipped
        run: |
          if grep -E "^SKIPPED .*(i18n_coverage_test|dashboard_synthetic_display_test)" pytest-extended.log; then
            echo "::error::a RUN_I18N_SCAN/RUN_DASHBOARD_E2E_SCAN test was skipped instead of run" >&2
            exit 1
          fi

      # A hosted machine discards the container anyway; every caller of the
      # action still tears its own down, so the action stays safe to call
      # from a persistent runner (test_every_caller_removes_its_container).
      - name: Stop and remove the Postgres container
        if: always()
        run: docker rm -f -v "${{ steps.postgres.outputs.container-name }}" 2>/dev/null || true

  # Its own job, so a passed date is a visible failure of this job alone: it
  # neither hides nor stops the suites above. A reminder, not a defect in a diff.
  removal-deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check removal deadlines
        working-directory: frontend
        run: npx vitest run src/routes/legacyRedirects.test.tsx -t "has not passed"
        env:
          RUN_DEADLINES: 1
