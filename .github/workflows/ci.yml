name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:14-3.2
        env:
          POSTGRES_USER: transit
          POSTGRES_PASSWORD: transit
          POSTGRES_DB: transit
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install

      # postgis/postgis:14-3.2 doesn't ship pgvector; the schema's
      # `CREATE EXTENSION vector` then errors with UndefinedFile. Build
      # pgvector from source pinned to a tag known to work with PG 14
      # contrib (avoids the apt dep cascade where current pgvector
      # `Breaks: postgresql-14-jit-llvm (< 16)` would upgrade core PG
      # packages and ABI-mismatch pg_trgm.so → `pg_mblen_unbounded`
      # symbol errors on `CREATE EXTENSION pg_trgm` in migration 0012).
      - name: Build pgvector from source in Postgres service
        run: |
          CID=$(docker ps -q --filter ancestor=postgis/postgis:14-3.2 | head -n1)
          # The container's PG 14 was compiled with LLVM JIT, so PGXS
          # always pulls a clang-11 bitcode rule even when --no-install
          # avoided LLVM apt deps. Two-pronged fix: install clang-11 so
          # the rule succeeds AND override BITCODE_FILES= to skip it
          # entirely — whichever path the PGXS Makefile.global takes,
          # the build now reaches `make install` and copies
          # vector.control to /usr/share/postgresql/14/extension/.
          docker exec "$CID" sh -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential git ca-certificates postgresql-server-dev-14 clang-11 llvm-11
            git clone --depth 1 --branch v0.7.4 https://github.com/pgvector/pgvector.git /tmp/pgvector
            cd /tmp/pgvector
            make BITCODE_FILES= MODULE_big_BITCODE_FILES=
            make BITCODE_FILES= MODULE_big_BITCODE_FILES= install
            test -f /usr/share/postgresql/14/extension/vector.control
            rm -rf /tmp/pgvector
          '

      - name: Apply schema
        run: poetry run python gtfs_pipeline.py migrate up
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:5433/transit

      - name: Lint and format check
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:5433/transit
          GROQ_API_KEY: test-key
        run: poetry run pytest
