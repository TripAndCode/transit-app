name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:14-3.2
        env:
          POSTGRES_USER: transit
          POSTGRES_PASSWORD: transit
          POSTGRES_DB: transit
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install

      # postgis/postgis:14-3.2 doesn't ship pgvector; the schema's
      # `CREATE EXTENSION vector` then errors with UndefinedFile. Install
      # the apt package into the running service container before migrate.
      - name: Install pgvector in Postgres service
        run: |
          CID=$(docker ps -q --filter ancestor=postgis/postgis:14-3.2 | head -n1)
          docker exec "$CID" sh -c "apt-get update && apt-get install -y --no-install-recommends postgresql-14-pgvector"

      - name: Apply schema
        run: poetry run python gtfs_pipeline.py migrate up
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:5433/transit

      - name: Lint and format check
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:5433/transit
          GROQ_API_KEY: test-key
        run: poetry run pytest
