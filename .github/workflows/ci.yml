name: CI

# `pull_request` is what the merge gate reads, and it already covers every
# branch headed anywhere. Listening on `push` for all branches as well meant
# every push to an open PR ran the whole suite twice over the same tree, for
# no extra signal.
# `push` stays for `main` alone, so a commit landing there outside a PR is
# still checked. Mirrors `secrets-scan.yml`.
on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per pull request: a new push supersedes the previous run
# instead of queueing behind it, so the current head is tested now rather
# than after every head before it. Pull requests only — a `main` run records what that commit
# did rather than previewing it, so nothing should cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Always GitHub-hosted. Nothing here needs Docker, a database or
  # ClickHouse; the one native dependency is the `python3` that
  # lint:i18n-strings shells out to, which every hosted image carries.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ESLint: type/hooks and jsx-a11y rules all fail the build. The calm-UI
      # accessibility rollout is complete, so the a11y rules are now enforced
      # as errors rather than warnings.
      - name: Lint
        run: npm run lint

      # Key-parity gate: every visible string's t() key must exist in both
      # frontend/src/i18n/locales/ja.json and en.json.
      - name: i18n key parity
        run: npm run lint:i18n

      # Exact-string gate for server-rendered strings the frontend can't see
      # through t(): shells out to `python3 scripts/lint-i18n-strings.py`.
      # The only native dependency in this job, and the reason it is worth
      # naming — it is what decides whether this job can stay hosted.
      - name: i18n exact-string check
        run: npm run lint:i18n-strings

      # Knip dead-code check: exits non-zero on any unused file/export, which
      # now gates the build to keep the tree free of dead code.
      - name: Dead-code check
        run: npm run deadcode

      # The coverage run is the unit-test run, not a second pass over the
      # suite: it fails on a failing test and on coverage below the thresholds
      # in vitest.config.ts alike, which nothing else enforces.
      - name: Unit tests + coverage thresholds
        run: npm run test:coverage

      # Fixture-based positive/negative controls for check-entry-chunk.mjs
      # itself — doesn't need a real build, just proves the detection logic
      # (marker scan, static-vs-dynamic closure walk, size budget) still
      # fires on a violation and stays quiet on a clean tree.
      - name: Entry-chunk checker unit tests
        run: npm run test:check-entry-chunk

      # Fixture-based positive/negative controls for check-css-tokens.mjs
      # itself, mirroring the entry-chunk checker's own tests above.
      - name: CSS tokens checker unit tests
        run: npm run test:check-css-tokens

      # Static scan (no build needed): every var(--x) reference resolves
      # (or has a fallback) and every z-index uses the shared ladder.
      - name: CSS tokens check
        run: npm run check:css-tokens

      - name: React Compiler checker unit tests
        run: npm run test:check-react-compiler

      - name: React Compiler compiles every component
        run: npm run check:react-compiler

      # Typecheck already ran above (tsc -b), so this build step skips it
      # (build:bundle = vite build only) and just enforces AGENTS.md's
      # "keep MapLibre out of the entry chunk" rule against the real bundle.
      - name: Build + entry-chunk check
        run: |
          npm run build:bundle
          npm run check:entry-chunk

  # Builds the root Dockerfile, which is what Railway deploys. `frontend` and
  # `test` install dependencies their own way, so a change that breaks only the
  # image (a base-image bump, npm config the Docker stage cannot see, a
  # lockfile only one install path accepts, an app import of a dependency
  # outside Poetry's `main` group) passes both and fails at deploy time.
  # Not path-filtered: what the image reads is nearly the whole tree, so a
  # filter could only ever be a stale subset of it. Hosted, like `frontend`,
  # so it runs alongside `test` instead of queueing on the one VPS runner.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # `context: .` builds the checked-out tree; the action's default is to
      # fetch its own Git context instead. The gha cache authenticates with
      # the runner's cache token, not the `permissions` above. `mode=max`
      # also caches the frontend stage, whose layers the final image does
      # not contain, and `ignore-error` keeps a refused or throttled cache
      # write from failing a build that succeeded.
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: transit-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # No network and no environment: importing the app needs neither,
      # because env validation and the database connections live in the
      # lifespan, not at import. What the import does prove is that the
      # `main` dependency group alone is enough to load every router.
      - name: Smoke-test the image
        run: |
          docker run --rm --network none transit-app:ci python -c "import api.main"
          docker run --rm --network none transit-app:ci test -f api/static/index.html

  # The backend jobs run where `vars.CI_BACKEND_RUNNER` says, GitHub-hosted
  # while it is unset: standard hosted runners cost nothing for a public
  # repository. The day hosted minutes start counting, set it to
  # `["self-hosted","vps"]`, and `vars.CI_TEST_SHARDS` to `[0]`, since the
  # VPS has a single runner and would only run the shards one after another.
  #
  # Whole-tree static checks, beside the test shards rather than ahead of them.
  backend-static:
    runs-on: ${{ fromJSON(vars.CI_BACKEND_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend
        with:
          python-version: "3.14"

      - name: Lint and format check
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy

  # The suite in shards that run at once, each on its own machine with its
  # own Postgres and ClickHouse; tests/sharding.py decides which files each
  # one keeps. fail-fast stays off so one shard's failure still reports the
  # others'.
  test:
    runs-on: ${{ fromJSON(vars.CI_BACKEND_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.CI_TEST_SHARDS || '[0, 1, 2]') }}

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        env:
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DB: transit_test
        # Host port left unmapped (dynamic) rather than pinned to 8124: a
        # persistent runner can already have something bound to a fixed
        # port, which an ephemeral GitHub-hosted VM never hits. Steps below
        # read the assigned port from `job.services.clickhouse.ports`.
        ports:
          - 8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend
        with:
          python-version: "3.14"

      - name: Start Postgres from db/Dockerfile
        id: postgres
        uses: ./.github/actions/start-test-postgres
        with:
          container-name: transit-ci-db

      - name: Apply schema
        run: poetry run python gtfs_pipeline.py migrate up
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:${{ steps.postgres.outputs.port }}/transit

      # Equivalent of `make ch-bootstrap`. The service container above isn't
      # started via docker compose/the Makefile, so this creates the
      # `updates` table directly (CREATE TABLE IF NOT EXISTS — idempotent).
      - name: Apply ClickHouse schema
        run: |
          poetry run python -c "from pipeline.clickhouse import get_client; \
          from db.clickhouse.bootstrap import apply_schema; apply_schema(get_client())"
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test

      # tests/unit/test_gitleaks_fixtures.py shells out to the real, pinned
      # gitleaks binary to prove the control fixtures are actually detected
      # (and redacted/allowlisted) rather than mocking the scanner -- it
      # skips itself when gitleaks isn't on PATH, so install it here or
      # those assertions silently never run. Mirrors secrets-scan.yml's own
      # pinned install; tests/unit/test_gitleaks_version_pin.py keeps this
      # GITLEAKS_VERSION in sync with every other pin site it checks
      # (.pre-commit-config.yaml, secrets-scan.yml, secrets-scan-full-history.yml,
      # scripts/setup_git_hooks.sh) -- see that test for the authoritative list.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          # A persistent runner can already have the right binary left over
          # from a previous run -- skip the download/extract in that case
          # rather than refetching an unchanged tarball from GitHub every job.
          if [ "$("$HOME/bin/gitleaks" version 2>/dev/null || true)" != "$GITLEAKS_VERSION" ]; then
            curl -sSfL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar -xz -C "$HOME/bin" gitleaks
          fi
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/gitleaks" version

      - name: Run tests
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:${{ steps.postgres.outputs.port }}/transit
          GEMINI_API_KEY: test-key
          CLICKHOUSE_HOST: localhost
          # tests/conftest.py's ch_client/ch_async_client fixtures (and a
          # handful of standalone test_*_ch.py files) read
          # CLICKHOUSE_TEST_PORT independently of pipeline/clickhouse.py's
          # own CLICKHOUSE_PORT -- scripts/run_integration_tests.sh sets
          # both from the same value for exactly this reason.
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_TEST_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test
          RUN_CH_INTEGRATION: 1
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARD_COUNT: ${{ strategy.job-total }}
          # Coverage instruments every line the suite executes and nothing
          # gates on the number, so a pull request pays for a report no check
          # reads. On `main`, where the figure describes what landed, each
          # shard keeps its data for the `coverage` job to combine: a shard
          # alone measures only its share of the suite.
          COV_ARGS: ${{ github.event_name == 'push' && '--cov=api --cov=pipeline --cov=db --cov-report=' || '' }}
          COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
        run: poetry run pytest $COV_ARGS

      - name: Keep this shard's coverage data
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      # A persistent self-hosted runner keeps its Docker state between runs,
      # so the container and its volume have to go even when this job fails
      # or is cancelled. The name is resolved by the action, not the literal
      # passed in above: it carries the run id so concurrent jobs do not
      # collide, and removing the prefix would remove nothing.
      - name: Stop and remove the Postgres container
        if: always()
        run: docker rm -f -v "${{ steps.postgres.outputs.container-name }}" 2>/dev/null || true

  # One coverage figure for what landed on `main`, combined from every shard.
  # Same runner as the shards: the data records the absolute paths of the
  # checkout it measured, and the report reads the source at those paths.
  coverage:
    if: github.event_name == 'push'
    needs: test
    runs-on: ${{ fromJSON(vars.CI_BACKEND_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-backend
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Report the combined coverage
        run: |
          poetry run coverage combine .coverage.shard-*
          poetry run coverage report
