name: CI

# `pull_request` is what the merge gate reads, and it already covers every
# branch headed anywhere. Listening on `push` for all branches as well meant
# every push to an open PR ran the whole suite twice over the same tree — on
# a single self-hosted runner that is double the queue for no extra signal.
# `push` stays for `main` alone, so a commit landing there outside a PR is
# still checked. Mirrors `secrets-scan.yml`.
on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per pull request: a new push supersedes the previous run
# instead of queueing behind it, which on one runner is the difference
# between the current head being tested now and being tested after every
# head before it. Pull requests only — a `main` run records what that commit
# did rather than previewing it, so nothing should cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # GitHub-hosted, unlike the `test` job below. Nothing here needs the VPS:
  # no Docker, no database, no ClickHouse — the one native dependency is the
  # `python3` that lint:i18n-strings shells out to, which every hosted image
  # carries. Running it here buys real parallelism with `test` instead of
  # queueing behind it on the single self-hosted runner, and takes the larger
  # of the two jobs off a box with 3.8 GiB of RAM, where two concurrent jobs
  # would not have fit.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ESLint: type/hooks and jsx-a11y rules all fail the build. The calm-UI
      # accessibility rollout is complete, so the a11y rules are now enforced
      # as errors rather than warnings.
      - name: Lint
        run: npm run lint

      # Key-parity gate: every visible string's t() key must exist in both
      # frontend/src/i18n/locales/ja.json and en.json.
      - name: i18n key parity
        run: npm run lint:i18n

      # Exact-string gate for server-rendered strings the frontend can't see
      # through t(): shells out to `python3 scripts/lint-i18n-strings.py`.
      # The only native dependency in this job, and the reason it is worth
      # naming — it is what decides whether this job can stay hosted.
      - name: i18n exact-string check
        run: npm run lint:i18n-strings

      # Knip dead-code check: exits non-zero on any unused file/export, which
      # now gates the build to keep the tree free of dead code.
      - name: Dead-code check
        run: npm run deadcode

      - name: Unit tests
        run: npm run test

      # Fixture-based positive/negative controls for check-entry-chunk.mjs
      # itself — doesn't need a real build, just proves the detection logic
      # (marker scan, static-vs-dynamic closure walk, size budget) still
      # fires on a violation and stays quiet on a clean tree.
      - name: Entry-chunk checker unit tests
        run: npm run test:check-entry-chunk

      # Fixture-based positive/negative controls for check-css-tokens.mjs
      # itself, mirroring the entry-chunk checker's own tests above.
      - name: CSS tokens checker unit tests
        run: npm run test:check-css-tokens

      # Static scan (no build needed): every var(--x) reference resolves
      # (or has a fallback) and every z-index uses the shared ladder.
      - name: CSS tokens check
        run: npm run check:css-tokens

      # Typecheck already ran above (tsc -b), so this build step skips it
      # (build:bundle = vite build only) and just enforces CLAUDE.md's
      # "keep MapLibre out of the entry chunk" rule against the real bundle.
      - name: Build + entry-chunk check
        run: |
          npm run build:bundle
          npm run check:entry-chunk

  test:
    runs-on: [self-hosted, vps]
    timeout-minutes: 45

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        env:
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DB: transit_test
        # Host port left unmapped (dynamic) rather than pinned to 8124: a
        # persistent runner can already have something bound to a fixed
        # port, which an ephemeral GitHub-hosted VM never hits. Steps below
        # read the assigned port from `job.services.clickhouse.ports`.
        ports:
          - 8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # setup-python first: this self-hosted runner has no system `pip`, so
      # the Poetry install below depends on the interpreter this step puts on
      # PATH. That rules out `cache: poetry`, which needs Poetry to already be
      # installed when setup-python runs -- the two requirements are mutually
      # exclusive here, and a working gate matters more than the cache.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install

      - name: Start Postgres from db/Dockerfile
        id: postgres
        uses: ./.github/actions/start-test-postgres
        with:
          container-name: transit-ci-db

      - name: Apply schema
        run: poetry run python gtfs_pipeline.py migrate up
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:${{ steps.postgres.outputs.port }}/transit

      # Equivalent of `make ch-bootstrap`. The service container above isn't
      # started via docker compose/the Makefile, so this creates the
      # `updates` table directly (CREATE TABLE IF NOT EXISTS — idempotent).
      - name: Apply ClickHouse schema
        run: |
          poetry run python -c "from pipeline.clickhouse import get_client; \
          from db.clickhouse.bootstrap import apply_schema; apply_schema(get_client())"
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test

      - name: Lint and format check
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy

      # tests/unit/test_gitleaks_fixtures.py shells out to the real, pinned
      # gitleaks binary to prove the control fixtures are actually detected
      # (and redacted/allowlisted) rather than mocking the scanner -- it
      # skips itself when gitleaks isn't on PATH, so install it here or
      # those assertions silently never run. Mirrors secrets-scan.yml's own
      # pinned install; tests/unit/test_gitleaks_version_pin.py keeps this
      # GITLEAKS_VERSION in sync with every other pin site it checks
      # (.pre-commit-config.yaml, secrets-scan.yml, secrets-scan-full-history.yml,
      # scripts/setup_git_hooks.sh) -- see that test for the authoritative list.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          # A persistent runner can already have the right binary left over
          # from a previous run -- skip the download/extract in that case
          # rather than refetching an unchanged tarball from GitHub every job.
          if [ "$("$HOME/bin/gitleaks" version 2>/dev/null || true)" != "$GITLEAKS_VERSION" ]; then
            curl -sSfL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar -xz -C "$HOME/bin" gitleaks
          fi
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/gitleaks" version

      - name: Run tests
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:${{ steps.postgres.outputs.port }}/transit
          GEMINI_API_KEY: test-key
          CLICKHOUSE_HOST: localhost
          # tests/conftest.py's ch_client/ch_async_client fixtures (and a
          # handful of standalone test_*_ch.py files) read
          # CLICKHOUSE_TEST_PORT independently of pipeline/clickhouse.py's
          # own CLICKHOUSE_PORT -- scripts/run_integration_tests.sh sets
          # both from the same value for exactly this reason.
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_TEST_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test
          RUN_CH_INTEGRATION: 1
          # Coverage instruments every line the suite executes and nothing
          # gates on the number it prints, so a pull request pays for a
          # report no check reads. `main` still produces one, which is where
          # the figure is worth having: it describes what landed.
          COV_ARGS: ${{ github.event_name == 'push' && '--cov=api --cov=pipeline --cov=db --cov-report=term' || '' }}
        run: poetry run pytest $COV_ARGS

      # A persistent self-hosted runner keeps its Docker state between runs,
      # so the container and its volume have to go even when this job fails
      # or is cancelled. The name is resolved by the action, not the literal
      # passed in above: it carries the run id so concurrent jobs do not
      # collide, and removing the prefix would remove nothing.
      - name: Stop and remove the Postgres container
        if: always()
        run: docker rm -f -v "${{ steps.postgres.outputs.container-name }}" 2>/dev/null || true

