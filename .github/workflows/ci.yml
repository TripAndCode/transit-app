name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ESLint: type/hooks and jsx-a11y rules all fail the build. The calm-UI
      # accessibility rollout is complete, so the a11y rules are now enforced
      # as errors rather than warnings.
      - name: Lint
        run: npm run lint

      # Knip dead-code check: exits non-zero on any unused file/export, which
      # now gates the build to keep the tree free of dead code.
      - name: Dead-code check
        run: npm run deadcode

      - name: Unit tests
        run: npm run test

      # Fixture-based positive/negative controls for check-entry-chunk.mjs
      # itself — doesn't need a real build, just proves the detection logic
      # (marker scan, static-vs-dynamic closure walk, size budget) still
      # fires on a violation and stays quiet on a clean tree.
      - name: Entry-chunk checker unit tests
        run: npm run test:check-entry-chunk

      # Typecheck already ran above (tsc -b), so this build step skips it
      # (build:bundle = vite build only) and just enforces CLAUDE.md's
      # "keep MapLibre out of the entry chunk" rule against the real bundle.
      - name: Build + entry-chunk check
        run: |
          npm run build:bundle
          npm run check:entry-chunk

  test:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DB: transit_test
        ports:
          - 8124:8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # This runner's root filesystem is small and shared with a lot of
      # preinstalled tooling this job never uses (Android SDK, .NET, GHC,
      # etc.) — reclaim it before anything else runs, including `poetry
      # install` itself: the ML embedder dependency alone is large enough
      # that installing it before this cleanup can exhaust the disk before
      # the db/Dockerfile image build (the other big consumer, see below)
      # ever starts. Hundreds of small Postgres data files written by the
      # suite have also tipped this already-tight disk into intermittent
      # `DiskFull` mid-run in the past.
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/share/swift 2>/dev/null || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install

      - name: Start Postgres from db/Dockerfile
        uses: ./.github/actions/start-test-postgres
        with:
          container-name: transit-ci-db

      - name: Apply schema
        run: poetry run python gtfs_pipeline.py migrate up
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:5433/transit

      # Equivalent of `make ch-bootstrap`. The service container above isn't
      # started via docker compose/the Makefile, so this creates the
      # `updates` table directly (CREATE TABLE IF NOT EXISTS — idempotent).
      - name: Apply ClickHouse schema
        run: |
          poetry run python -c "from pipeline.clickhouse import get_client; \
          from db.clickhouse.bootstrap import apply_schema; apply_schema(get_client())"
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8124
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test

      - name: Lint and format check
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy

      - name: Run tests
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:5433/transit
          GROQ_API_KEY: test-key
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8124
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test
          RUN_CH_INTEGRATION: 1
        run: poetry run pytest --cov=api --cov=pipeline --cov=db --cov-report=term
