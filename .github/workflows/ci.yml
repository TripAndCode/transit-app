name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ESLint: type/hooks and jsx-a11y rules all fail the build. The calm-UI
      # accessibility rollout is complete, so the a11y rules are now enforced
      # as errors rather than warnings.
      - name: Lint
        run: npm run lint

      # Knip dead-code check: exits non-zero on any unused file/export, which
      # now gates the build to keep the tree free of dead code.
      - name: Dead-code check
        run: npm run deadcode

      - name: Unit tests
        run: npm run test

      # Fixture-based positive/negative controls for check-entry-chunk.mjs
      # itself — doesn't need a real build, just proves the detection logic
      # (marker scan, static-vs-dynamic closure walk, size budget) still
      # fires on a violation and stays quiet on a clean tree.
      - name: Entry-chunk checker unit tests
        run: npm run test:check-entry-chunk

      # Typecheck already ran above (tsc -b), so this build step skips it
      # (build:bundle = vite build only) and just enforces CLAUDE.md's
      # "keep MapLibre out of the entry chunk" rule against the real bundle.
      - name: Build + entry-chunk check
        run: |
          npm run build:bundle
          npm run check:entry-chunk

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:14-3.2
        env:
          POSTGRES_USER: transit
          POSTGRES_PASSWORD: transit
          POSTGRES_DB: transit
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DB: transit_test
        ports:
          - 8124:8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install

      # This runner's root filesystem is small and shared with a lot of
      # preinstalled tooling this job never uses (Android SDK, .NET, GHC,
      # etc.) — reclaim it before anything else runs. Verified locally
      # (2026-07-27): apt-installing any currently-available pgvector
      # package for PG 14/pgdg11 (0.8.2, the one version that avoided
      # forcing a postgresql-14 core upgrade, has since been pruned from
      # the PGDG pool — only 0.8.3+ remain, and all of them still pull in a
      # postgresql-14 upgrade as an ordinary `Depends:`, not merely the
      # `Breaks: postgresql-14-jit-llvm` line the apt error reports; with
      # apt-mark hold in place, apt refuses outright rather than silently
      # upgrading) still upgrades postgresql-14 to a build the live-running
      # PG 14.5 server wasn't compiled against, ABI-mismatching pg_trgm.so
      # against the running server. So building from source stays the
      # correct approach for a live-patched container — but it pulls in a
      # ~1.2GB C toolchain (build-essential, clang-11, llvm-11, git) that,
      # on top of hundreds of small Postgres data files written by ~750
      # tests, has been tipping this already-tight disk over into
      # intermittent `DiskFull` mid-suite. Freeing unused preinstalled
      # tooling here, plus purging the toolchain right after the build
      # below, closes that gap without touching the build/version logic
      # that already works.
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/share/swift 2>/dev/null || true
          df -h /

      # postgis/postgis:14-3.2 doesn't ship pgvector; the schema's
      # `CREATE EXTENSION vector` then errors with UndefinedFile. Build
      # pgvector from source pinned to a tag known to work with PG 14
      # contrib (avoids the apt dep cascade where current pgvector
      # `Breaks: postgresql-14-jit-llvm (< 16)` would upgrade core PG
      # packages and ABI-mismatch pg_trgm.so → `pg_mblen_unbounded`
      # symbol errors on `CREATE EXTENSION pg_trgm` in migration 0012).
      #
      # The C toolchain needed to build it (build-essential, clang-11,
      # llvm-11, git — ~1.2GB installed) is purged again immediately after
      # `make install` copies vector.control/vector.so into place; only
      # the compiled extension needs to remain for the rest of the job.
      - name: Build pgvector from source in Postgres service
        run: |
          CID=$(docker ps -q --filter ancestor=postgis/postgis:14-3.2 | head -n1)
          # The container's PG 14 was compiled with LLVM JIT, so PGXS
          # always pulls a clang-11 bitcode rule even when --no-install
          # avoided LLVM apt deps. Two-pronged fix: install clang-11 so
          # the rule succeeds AND override BITCODE_FILES= to skip it
          # entirely — whichever path the PGXS Makefile.global takes,
          # the build now reaches `make install` and copies
          # vector.control to /usr/share/postgresql/14/extension/.
          docker exec "$CID" sh -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential git ca-certificates postgresql-server-dev-14 clang-11 llvm-11
            git clone --depth 1 --branch v0.7.4 https://github.com/pgvector/pgvector.git /tmp/pgvector
            cd /tmp/pgvector
            make BITCODE_FILES= MODULE_big_BITCODE_FILES=
            make BITCODE_FILES= MODULE_big_BITCODE_FILES= install
            test -f /usr/share/postgresql/14/extension/vector.control
            rm -rf /tmp/pgvector
            apt-get purge -y build-essential clang-11 llvm-11 git
            apt-get autoremove -y
            rm -rf /var/lib/apt/lists/*
          '

      - name: Apply schema
        run: poetry run python gtfs_pipeline.py migrate up
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:5433/transit

      # Equivalent of `make ch-bootstrap`. The service container above isn't
      # started via docker compose/the Makefile, so this creates the
      # `updates` table directly (CREATE TABLE IF NOT EXISTS — idempotent).
      - name: Apply ClickHouse schema
        run: |
          poetry run python -c "from pipeline.clickhouse import get_client; \
          from db.clickhouse.bootstrap import apply_schema; apply_schema(get_client())"
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8124
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test

      - name: Lint and format check
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy

      - name: Run tests
        env:
          DATABASE_URL: postgresql://transit:transit@localhost:5433/transit
          GROQ_API_KEY: test-key
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8124
          CLICKHOUSE_USER: transit
          CLICKHOUSE_PASSWORD: transit
          CLICKHOUSE_DATABASE: transit_test
          RUN_CH_INTEGRATION: 1
        run: poetry run pytest --cov=api --cov=pipeline --cov=db --cov-report=term
