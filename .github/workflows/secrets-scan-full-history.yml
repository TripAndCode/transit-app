name: secrets-scan-full-history

# Scheduled/dispatchable backstop, additional to (not a replacement for)
# secrets-scan.yml: that workflow scans on every PR and push to main, but
# only ever the ref it checks out (a PR head or a push's branch) -- a
# secret sitting only on some other branch, a long-lived non-main branch,
# or a commit that predates item 126's pre-commit hook and secrets-scan.yml
# themselves, is invisible to it. This job re-fetches every branch and tag
# and scans the full history reachable from any of them, on a fixed
# cadence, independent of what any particular PR/push happens to touch.
# Doesn't conflict with the [skip ci] convention -- schedule/workflow_dispatch
# triggers are unaffected by that commit-trailer, same as
# vps-heartbeat-watchdog.yml and ask-eval-weekly.yml.
on:
  schedule:
    - cron: "13 4 * * *" # daily, offset off the hour
  workflow_dispatch: {}

# Least-privilege: read-only, matching secrets-scan.yml. A failure here is
# the alert itself -- GitHub emails repo watchers on a failed scheduled
# workflow by default, the same anomaly-only channel
# vps-heartbeat-watchdog.yml already relies on for the VPS loop, so no
# separate paging/notification integration is needed. --redact (below)
# keeps that failure email, and every log line leading up to it, from ever
# containing the matched secret value.
permissions:
  contents: read

jobs:
  gitleaks-full-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 0 = full, unshallowed history for the checked-out (default)
          # branch; the explicit fetch below then pulls every other
          # branch and tag's history too, on top of that unshallowed base.
          fetch-depth: 0

      - name: Fetch every branch and tag
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags origin

      - name: Install gitleaks
        env:
          # Pinned to the same version as .pre-commit-config.yaml,
          # secrets-scan.yml, ci.yml, and scripts/setup_git_hooks.sh.
          # tests/unit/test_gitleaks_version_pin.py asserts all five stay
          # in sync.
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history reachable from any branch or tag
        # --log-opts is passed straight through to the underlying `git
        # log`; --all walks every ref (all local branches, the
        # remote-tracking refs fetched above, and tags), not just HEAD's
        # ancestry the way secrets-scan.yml's and `make verify-secrets`'s
        # plain `gitleaks detect --source .` do. Same `make
        # verify-secrets-all-branches` target reproduces this locally.
        run: gitleaks detect --redact --no-banner --source . --log-opts="--all"
